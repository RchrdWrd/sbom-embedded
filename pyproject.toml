[project]
name = "sbom-embedded"
version = "0.1.0"
description = "CycloneDX SBOM generator for Yocto and Buildroot build output"
readme = "README.md"
authors = [{ name = "Richard Ward", email = "richard.daily.ward@gmail.com" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sbom", "cyclonedx", "yocto", "buildroot", "embedded", "cra"]
dependencies = [
    "typer>=0.12",
    "cyclonedx-python-lib>=8",
    "packageurl-python>=0.15",
]

[project.urls]
Homepage = "https://github.com/RchrdWrd/sbom-embedded"
Source = "https://github.com/RchrdWrd/sbom-embedded"

[project.scripts]
sbom-embedded = "sbom_embedded.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "cyclonedx-python-lib[json-validation]>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_embedded"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "DESIGN.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sbom_embedded"]
