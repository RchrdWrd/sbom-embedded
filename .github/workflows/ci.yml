name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nothing in this repo has to change for this to matter: the run exists to
    # notice that *upstream* changed. Weekly is enough -- cyclonedx-python-lib
    # ships roughly monthly. Deliberately off the hour; runs queued at :00 are
    # the ones GitHub delays or drops.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. A scheduled run and a push to main share
  # this group, and cancelling either loses the signal it existed to produce.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The matrix is the point: pyproject claims requires-python >=3.11, and
    # that claim is only worth making if something checks it.
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e . --group dev

      - name: Test
        run: python -m pytest -v

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e . --group dev

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Mypy
        run: mypy

  minimum-versions:
    # The declared lower bounds are a promise. This job is what makes it true:
    # it installs exactly the floor of every runtime dependency and runs the
    # tool. Both floors were wrong before this existed -- the code imports
    # cyclonedx.contrib, which does not exist below 11.6, and typer below 0.16
    # breaks against current click.
    name: oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install at the declared floors
        run: |
          python -m pip install --upgrade pip
          pip install \
            'typer==0.16.0' \
            'cyclonedx-python-lib[json-validation]==11.6.0' \
            'packageurl-python==0.15.0' \
            pytest
          pip install --no-deps -e .

      - name: Run
        run: |
          sbom-embedded --version
          python -m pytest -q

  upstream-canary:
    # The mirror image of minimum-versions: that job pins the declared floor,
    # this one deliberately steps past the declared cap.
    #
    # The rest of CI only runs when someone pushes, but `pipx run
    # sbom-embedded` and `uvx sbom-embedded` resolve dependencies at *run*
    # time. Without this job the first person to meet a breaking upstream
    # release is a user, and nothing here would say so until the next PR.
    #
    # Skipped on pull_request on purpose: it fails for reasons that have
    # nothing to do with the PR, and must never gate a merge.
    name: upstream canary (${{ matrix.channel }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest released, ignoring the cap in pyproject -- this is what says
          # when the cap has started costing users a real upgrade.
          - channel: released
            flags: ""
          # Newest including pre-releases. A new major shows up here first,
          # which is the point: the cap buys a migration window only if
          # something opens it before 12.0.0 final lands.
          - channel: prerelease
            flags: "--pre"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the newest dependencies, ignoring the declared cap
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install --upgrade ${{ matrix.flags }} \
            'cyclonedx-python-lib[json-validation]' typer packageurl-python pytest
          pip install --no-deps -e .

      - name: Record what actually resolved
        # An SBOM tool that cannot say which library built its output has a
        # provenance problem. This is the evidence in a failed run.
        run: pip freeze

      - name: Test
        run: python -m pytest -q

      - name: Fail on a deprecation of anything we import
        # Upstream deprecates an import path one major before removing it --
        # cyclonedx.factory.license already carries @deprecated today. This is
        # the warning shot; without it the first signal is an ImportError in
        # someone's `pipx run`.
        run: python -m pytest -q -W error::DeprecationWarning

      - name: Run the CLI the way a user does
        run: |
          sbom-embedded tests/fixtures/buildroot-2026.08 -o /tmp/sbom.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("/tmp/sbom.json").read_text())
          assert doc["specVersion"] == "1.6", doc["specVersion"]
          assert len(doc["components"]) == 44, len(doc["components"])
          missing = [c["name"] for c in doc["components"] if not c.get("purl")]
          assert not missing, missing
          PY

  package:
    # Builds the distribution and runs the CLI from the installed wheel, in a
    # separate environment from the source tree -- the path a `pipx run` user
    # actually takes.
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/sbom-embedded --version
          cd /tmp
          /tmp/wheeltest/bin/sbom-embedded \
            "$GITHUB_WORKSPACE/tests/fixtures/buildroot-2026.08" -o /tmp/sbom.json
          python - <<'PY'
          import json
          doc = json.load(open("/tmp/sbom.json"))
          assert doc["specVersion"] == "1.6", doc["specVersion"]
          components = doc["components"]
          assert len(components) == 44, len(components)
          missing = [c["name"] for c in components if not c.get("purl")]
          assert not missing, missing
          print(f"{len(components)} components, all with a purl")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
